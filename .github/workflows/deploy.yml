name: CI/CD Next.js Vercel Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Guarda en caché node_modules para que sea más rápido

      - name: Instalar dependencias
        run: npm ci

      - name: Validar tipos de TypeScript y Compilar
        run: npm run build # En Next.js esto valida TS. Si hay errores de tipado, el pipeline se detiene aquí.

      - name: Ejecutar Tests
        run: npm run test # Corre tus pruebas. Si una falla, el despliegue se cancela automáticamente.

      - name: Descargar información de entorno de Vercel
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilar artefactos de Vercel
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Desplegar a Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
